    '<div class="bt">Ingresos</div>' + tbl(b.ing) + '<div class="tr tot"><span>Total ingresos</span><span class="num">' + fmt(b.totalIng) + '</span></div>' +
    '<div class="bt">Descuentos</div>' + tbl(b.des) + '<div class="tr tot"><span>Total descuentos</span><span class="num">' + fmt(b.totalDes) + '</span></div>' +
    '<div class="neto"><span>Neto a pagar</span><span class="num">' + fmt(b.neto) + '</span></div>' +
    '<div class="bt">Aportes del empleador</div><div class="tbl"><div class="tr"><span>EsSalud (9%)</span><span class="num">' + fmt(b.essalud) + '</span></div></div>' +
    (b.capRet ? '<p class="fine">La retención de 5.ª categoría se limitó a lo que cobra el trabajador en el mes.</p>' : '') +
    '<div class="firmas"><div class="fbox"><div class="fimg" id="bf-emp"><span class="fine">Firmando…</span></div><div class="fl" id="bf-empl">Empleador: <b>' + esc(S.empresa.name || '—') + '</b></div></div>' +
      '<div class="fbox"><div class="fimg">' + (firmaTrab(id) ? '<img alt="Firma del trabajador" src="' + firmaTrab(id) + '">' : '') + '</div><div class="fl">Trabajador: <b>' + esc(w.name) + '</b></div>' +
      '<button type="button" class="btn ghost sm noprint" data-act="firma-trab" data-id="' + esc(id) + '">' + (firmaTrab(id) ? 'Cambiar firma' : 'Firmar en pantalla') + '</button></div></div>' +
    '<p class="fine">Firma electrónica simple: el QR verifica que los datos no se modificaron desde que se emitió la boleta; no es una firma digital con certificado. Documento referencial generado con Liquida; no reemplaza la boleta electrónica ni el PLAME. Confirma los datos con tu contador.</p></div>' +
    '<div class="acts-col noprint"><button type="button" class="btn block" data-act="pdf-boleta">Imprimir o guardar como PDF</button></div>');
  const slot = document.getElementById('bf-emp'), lab = document.getElementById('bf-empl');
  if (slot && window.crypto && crypto.subtle) {
    firmarBoleta(w, b).then(function (f) {
      const s2 = document.getElementById('bf-emp'), l2 = document.getElementById('bf-empl');
      if (!s2) return;
      s2.innerHTML = qrSvg(f.url, 116);
      if (l2) l2.innerHTML = 'Firmado electrónicamente por <b>' + esc(S.empresa.name || 'el empleador') + '</b> · llave ' + esc(f.huella) + ' · ' + dmy(iso(new Date(f.ts * 1000))) + '<br>Verifica escaneando el QR.';
    }).catch(function () { const s2 = document.getElementById('bf-emp'); if (s2) s2.innerHTML = '<span class="fine">No se pudo firmar en este navegador.</span>'; });
  } else if (slot) slot.innerHTML = '<span class="fine">Este navegador no permite firmar.</span>';
}
function setRes() { const r = document.getElementById('res'); if (r) r.innerHTML = resultHTML(); }

app.addEventListener('input', function (e) {
  if (e.target.dataset.benq !== undefined) {
    S.benQ = e.target.value;
    const box = document.getElementById('ben-list');
    if (box) { const k = benK(); let first = true, shown = 0; box.innerHTML = BEN.map(function (g) { const its = g.items.filter(function (i) { return benMatch(i, k, S.benQ); }); shown += its.length; if (!its.length) return ''; return '<h3 class="gt" id="bg-' + g.id + '">' + g.t + '</h3>' + its.map(function (i) { const o = S.benAll || !!S.benQ || first; first = false; return benItem(i, k, o); }).join(''); }).join('') + (shown ? '' : '<p class="bnone">No encontré beneficios con esa búsqueda.</p>'); }
    return;
  }
  if (e.target.dataset.emp) {
    const key = e.target.dataset.emp;
    if (key === 'ruc') { const c = e.target.value.replace(/\D/g, '').slice(0, 11); if (c !== e.target.value) e.target.value = c; }
    S.empresa[key] = e.target.value; save(); return;
  }
  const k = e.target.dataset.k; if (!k) return;
  const t = e.target;
  if (t.type === 'checkbox') {
    if (k === 'despido' && t.checked && !S.premium) { t.checked = false; openPremium(); return; }
    S.f[k] = t.checked;
  } else if (t.type === 'number') S.f[k] = t.value === '' ? '' : Number(t.value);
  else S.f[k] = t.value;
  if (k === 'gratiLast' && t.value === '') S.f[k] = '';
  save(); setRes();
});
app.addEventListener('change', function (e) {
  if (e.target.dataset.actChange === 'pick') {
    const w = S.workers.filter(function (x) { return x.id === e.target.value; })[0];
    if (w) { S.f.sueldo = w.sueldo; S.f.asig = w.asig; S.f.reg = w.reg; save(); render(); toast('Datos de ' + w.name + ' cargados'); }
  } else if (e.target.dataset.actChange === 'period') {
    if (/^\d{4}-(0[1-9]|1[0-2])$/.test(e.target.value)) { S.period = e.target.value; render(); }
  }
});
function onClick(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'tab') { S.tab = v; render(); }
  else if (a === 'calc') { S.calc = v; save(); render(); }
  else if (a === 'modo') { S.f.modo = v; save(); render(); }
  else if (a === 'copy') copy(S.copyText || '');
  else if (a === 'csv-res') downloadCSV('liquida-' + S.calc + '.csv', S.csvRows || []);
  else if (a === 'pdf-res') printView('print-res');
  else if (a === 'csv-plan') {
    const pm = planBlock();
    const rows = [['Liquida - Planilla mensual'], ['Periodo', periodLabel(S.period)], ['Empleador', S.empresa.name, 'RUC', S.empresa.ruc], ['Régimen', 'General (D. Leg. 728)'],
      ['Trabajador', 'DNI', 'Días pagados', 'Total ingresos', 'Gratificación y bonificación', 'Pensión', 'Retención 5.ª categoría', 'Tardanzas y otros descuentos', 'Total descuentos', 'Neto a pagar', 'EsSalud empleador', 'Costo laboral', 'CTS a depositar']];
    pm.rows.forEach(function (r) {
      const x = r.b;
      rows.push([r.w.name, r.w.dni || '', x.dias, x.totalIng.toFixed(2), x.grat.toFixed(2), x.pen.toFixed(2), x.ret.toFixed(2), r2(x.otros + x.tardDesc).toFixed(2), x.totalDes.toFixed(2), x.neto.toFixed(2), x.essalud.toFixed(2), x.costo.toFixed(2), x.ctsDep.toFixed(2)]);
    });
    const t = pm.t;
    rows.push(['Total', '', '', t.ing.toFixed(2), t.grat.toFixed(2), t.pen.toFixed(2), t.ret.toFixed(2), t.otros.toFixed(2), t.des.toFixed(2), t.neto.toFixed(2), t.essalud.toFixed(2), t.costo.toFixed(2), t.cts.toFixed(2)]);
    rows.push(['Cálculo referencial, no es asesoría legal ni financiera']);
    downloadCSV('liquida-planilla-' + S.period + '.csv', rows);
  }
  else if (a === 'pdf-plan') printView('print-plan');
  else if (a === 'nov') openNov(b.dataset.id);
  else if (a === 'boleta') { if (!S.premium) openPremium(); else openBoleta(b.dataset.id); }
  else if (a === 'pdf-boleta') printView('print-boleta');
  else if (a === 'ben-all') { S.benAll = !S.benAll; render(); }
  else if (a === 'ir-calc') { if (CALCS.some(function (c) { return c.id === v; })) { S.tab = 'calc'; S.calc = v; save(); render(); window.scrollTo(0, 0); } }
  else if (a === 'reg-ben') { if (v === 'general' || v === 'pequena' || v === 'micro') { S.f.reg = v; save(); render(); } }
  else if (a === 'firma-trab') openFirmaPad(b.dataset.id);
  else if (a === 'firma-clear') { const c = document.getElementById('fp'); if (c && c.getContext) { c.getContext('2d').clearRect(0, 0, c.width, c.height); c.dataset.any = ''; } }
  else if (a === 'firma-back') openBoleta(b.dataset.id);
  else if (a === 'firma-save') {
    const c = document.getElementById('fp');
    if (!c || !c.dataset.any) { toast('Dibuja la firma primero'); return; }
    firmaTrabSet(b.dataset.id, c.toDataURL('image/png')); toast('Firma guardada'); openBoleta(b.dataset.id);
  }
  else if (a === 'savenov') {
    const id = b.dataset.id, g = function (k) { const el = document.getElementById('nv-' + k); return el ? el.value : ''; };
    const o = {};
    ['faltas', 'tardanza', 'he25', 'he35', 'bonos', 'otros', 'mesesSem', 'remPrev', 'retPrev'].forEach(function (k) {
      const val = g(k); if (val !== '') o[k] = Number(val);
    });
    if (o.faltas > 30) o.faltas = 30;
    if (!S.nov[S.period]) S.nov[S.period] = {};
    S.nov[S.period][id] = o;
    save(); closeSheet(); render(); toast('Novedades guardadas');
  }
  else if (a === 'clearnov') { if (S.nov[S.period]) delete S.nov[S.period][b.dataset.id]; save(); closeSheet(); render(); toast('Novedades limpiadas'); }
  else if (a === 'editw') openAdd(b.dataset.id);
  else if (a === 'prem') openPremium();
  else if (a === 'plan') { S.plan = v; openPremium(); }
  else if (a === 'goprem') { if (licOn()) return; const pm = document.getElementById('p-mail'); if (pm && pm.value) sendLead(pm.value.trim()); S.premium = true; recordInterest(); save(); closeSheet(); render(); toast('Premium activado (demo)'); }
  else if (a === 'unprem') { S.premium = false; S.lic = null; S.licInfo = null; S.licCode = ''; S.licMsg = ''; S.licDraft = ''; S.f.despido = false; save(); closeSheet(); render(); }
  else if (a === 'lead') {
    const pm = document.getElementById('p-mail');
    if (pm && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(pm.value.trim())) { sendLead(pm.value.trim()); recordInterest(); toast('Listo, te contactaremos con los datos de pago'); }
    else toast('Escribe un correo válido');
  }
  else if (a === 'activate') {
    const el = document.getElementById('p-code'), raw = el ? el.value : '';
    S.licDraft = raw;
    licVerify(raw, LIC.pub, iso(new Date())).then(function (r) {
      if (r.ok) {
        S.licCode = raw.replace(/\s+/g, ''); S.lic = r; S.licInfo = null; S.premium = true; S.licMsg = ''; S.licDraft = '';
        save(); closeSheet(); render(); toast('Premium activo hasta el ' + dmy(r.exp));
      } else { S.licMsg = licMessage(r); openPremium(); }
    });
  }
  else if (a === 'close') closeSheet();
  else if (a === 'addw') { if (!S.premium && S.workers.length >= 3) openPremium(); else openAdd(); }
  else if (a === 'savew') {
    const name = document.getElementById('n-name').value.trim();
    if (!name) { toast('Escribe un nombre'); return; }
    const data = { name: name, dni: document.getElementById('n-dni').value.trim(), sueldo: Number(document.getElementById('n-sueldo').value) || 0,
      asig: document.getElementById('n-asig').checked, reg: document.getElementById('n-reg').value,
      pension: document.getElementById('n-pension').value, afp: document.getElementById('n-afp').value, comision: document.getElementById('n-com').value,
      eps: document.getElementById('n-eps').checked };
    const cur = b.dataset.id ? findW(b.dataset.id) : null;
    if (cur) Object.assign(cur, data); else S.workers.push(Object.assign({ id: 'w' + Date.now().toString(36) }, data));
    save(); closeSheet(); render();
  }
  else if (a === 'del') { S.workers = S.workers.filter(function (w) { return w.id !== b.dataset.id; }); Object.keys(S.nov).forEach(function (p) { delete S.nov[p][b.dataset.id]; }); save(); render(); }
  else if (a === 'use') {
    const w = S.workers.filter(function (x) { return x.id === b.dataset.id; })[0];
    if (w) { S.f.sueldo = w.sueldo; S.f.asig = w.asig; S.f.reg = w.reg; S.tab = 'calc'; save(); render(); window.scrollTo(0, 0); }
  }
}
app.addEventListener('click', onClick);
sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); else onClick(e); });
sheet.addEventListener('change', function (e) {
  if (e.target.id === 'n-pension') { const bx = document.getElementById('n-afpbox'); if (bx) bx.hidden = e.target.value !== 'afp'; }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
(function () {
  try {
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
      const p = kv.split('='), k = p[0], v = decodeURIComponent(p[1] || '');
      if (k === 'calc' && CALCS.some(function (c) { return c.id === v; })) { S.calc = v; S.tab = 'calc'; }
      else if (k === 'tab' && ['calc', 'team', 'plan', 'guide'].indexOf(v) >= 0) S.tab = v;
      else if (['sueldo', 'varProm', 'meses', 'dias', 'monto'].indexOf(k) >= 0 && v !== '' && !isNaN(v)) S.f[k] = Number(v);
      else if (k === 'reg' && REG[v]) S.f.reg = v;
    });
  } catch (e) {}
})();
render();
// Con cobro activo, el Premium guardado se vuelve a verificar al abrir la página (firma y vencimiento).
if (licOn() && S.licCode) {
  licVerify(S.licCode, LIC.pub, iso(new Date())).then(function (r) {
    if (r.ok) { S.premium = true; S.lic = r; S.licInfo = null; }
    else { S.premium = false; S.lic = null; S.licInfo = r; }
    render();
  });
}

</script>
