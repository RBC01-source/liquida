function compute() {
  const f = S.f, c = computable(f), rg = REG[f.reg];

  if (S.calc === 'grati') {
    const g = gratificacion(Object.assign({ meses: Number(f.meses), eps: !!f.eps }, base));
    const rows = [['Remuneración computable', g.comp], ['Gratificación (' + f.meses + '/6)', g.base], ['Bonificación extraordinaria ' + (f.eps ? '6.75%' : '9%'), g.bon]];
    const notes = [];
    if (f.reg === 'micro') notes.push('La microempresa REMYPE no paga gratificaciones.');
    if (f.reg === 'pequena') notes.push('La pequeña empresa REMYPE paga media gratificación (½ sueldo por semestre).');
    return { band: { l: 'Gratificación a recibir', v: g.total, s: 'Se paga hasta el 15 de julio y el 15 de diciembre' }, rows: rows, total: ['Total a recibir', g.total],
      formula: '(' + fmt(g.comp) + ' × ' + (rg.g === 1 ? '1' : rg.g === 0.5 ? '½' : '0') + ' ÷ 6) × ' + f.meses + ' = ' + fmt(g.base) + ', más bonificación', notes: notes };
  }
  if (S.calc === 'cts') {
    const t = cts(Object.assign({ meses: Number(f.meses), dias: Number(f.dias), gratiLast: f.gratiLast }, base));
    const notes = [];
    if (f.reg === 'micro') notes.push('La microempresa REMYPE no tiene derecho a CTS.');
    if (f.reg === 'pequena') notes.push('La pequeña empresa REMYPE paga CTS equivalente a 15 remuneraciones diarias por año (50%).');
    return { band: { l: 'CTS a depositar', v: t.total, s: 'Se deposita hasta el 15 de mayo y el 15 de noviembre' },
      rows: [['Remuneración computable', t.comp], ['1/6 de la gratificación', t.sexto], ['Base de cálculo', t.base]], total: ['CTS del periodo', t.total],
      formula: fmt(t.base) + ' ÷ 12 × ' + f.meses + ' meses + ' + fmt(t.base) + ' ÷ 360 × ' + f.dias + ' días', notes: notes };
  }
  if (S.calc === 'vac') {
    if (f.modo === 'goce') {
      const pay = r2(c * (rg.v / 30) * 0 + c / 30 * (Number(f.diasGoce) || 0));
      return { band: { l: 'Remuneración vacacional', v: pay, s: (f.diasGoce || 0) + ' días a gozar' }, rows: [['Remuneración computable', c], ['Valor por día (÷ 30)', r2(c / 30)]], total: ['Total del periodo', pay],
        formula: fmt(c) + ' ÷ 30 × ' + (f.diasGoce || 0) + ' días', notes: ['En régimen general corresponden 30 días por año; en REMYPE, 15 días.'] };
    }
    const v = vacTrunca(Object.assign({ meses: Number(f.meses), dias: Number(f.dias) }, base));
    return { band: { l: 'Vacaciones truncas', v: v, s: 'Pago proporcional al tiempo trabajado' }, rows: [['Remuneración computable', c], ['Días de descanso por año', rg.v]], total: ['Total a recibir', v],
      formula: fmt(c) + ' × (' + rg.v + '/30) × (' + f.meses + '/12 + ' + f.dias + '/360)', notes: [] };
  }
  if (S.calc === 'liq') {
    if (!f.ingreso || !f.cese || f.ingreso > f.cese) return { error: 'La fecha de cese debe ser igual o posterior a la de ingreso.' };
    const L = liquidacion(Object.assign({ ingreso: f.ingreso, cese: f.cese, vencidos: Number(f.vencidos) || 0, despido: !!f.despido && S.premium, eps: !!f.eps }, base));
    const rows = L.items.map(function (i) { return [i.l, i.v]; });

    return { band: { l: 'Liquidación estimada', v: L.total, s: 'Beneficios sociales al cese' }, rows: rows, total: ['Total estimado', L.total], formula: '', notes: notes };
  }
  if (S.calc === 'neto') {
    const n = sueldoNeto(Object.assign({ pension: f.pension, afpPct: Number(f.afpPct) || 0 }, base));
    const notes = ['Estimación del mes ordinario: proyecta 12 sueldos y 2 gratificaciones con bonificación, deduce 7 UIT (' + fmt(7 * UIT) + ') y divide el impuesto anual entre 12.',
      'En julio y diciembre la retención sube por la gratificación, y puede variar si tienes otros ingresos o gastos deducibles.'];
    if (f.reg === 'micro') notes.push('Microempresa: sin gratificaciones en la proyección.');

      rows: [['Remuneración bruta', n.comp], ['Pensión (' + (f.pension === 'onp' ? 'ONP 13%' : f.pension === 'afp' ? 'AFP ' + (Number(f.afpPct) || 0) + '%' : 'ninguna') + ')', -n.pen],
        ['Renta anual proyectada', n.anual], ['Renta neta imponible (− 7 UIT)', n.neta], ['Impuesto anual', n.taxAnual], ['Retención mensual 5.ª cat.', -n.ret]],
      total: ['Sueldo neto', n.neto], formula: fmt(n.comp) + ' − ' + fmt(n.pen) + ' − ' + fmt(n.ret), notes: notes };
  }
  const h = honorarios(Number(f.monto) || 0, !!f.susp);
  const notes = [];
  if ((Number(f.monto) || 0) <= 3000) notes.push('Hasta S/ 3,000 mensuales no corresponde retención de 4.ª categoría.');
  notes.push('El impuesto anual es una estimación solo con renta de 4.ª categoría (deduce 20% y 7 UIT; UIT ' + fmt(UIT) + ').');
  return { band: { l: 'Neto mensual tras retención', v: h.neto, s: h.ret ? 'Retención del 8%: ' + fmt(h.ret) : 'Sin retención' },
    rows: [['Honorario mensual', Number(f.monto) || 0], ['Retención (8%)', -h.ret], ['Renta neta anual imponible', h.neta], ['Impuesto anual estimado', h.tax], ['Equivale a, por mes', h.mensual]], total: ['Neto mensual', h.neto],
    formula: '', notes: notes };
}

  if (S.premium) {
    h += '<section class="card"><h2>Costo de planilla por semestre</h2><div class="tbl"><div class="tr"><span>Gratificaciones (con bonif.)</span><span class="num">' + fmt(r2(tg)) + '</span></div>' +
      '<div class="tr"><span>CTS</span><span class="num">' + fmt(r2(tc)) + '</span></div><div class="tr tot"><span>Total estimado</span><span class="num">' + fmt(r2(tg + tc)) + '</span></div></div></section>';
  } else {
    h += '<section class="card"><h2>' + ICON.lock + ' Totales de planilla</h2><p class="sub">Con Premium ves cuánto necesitas provisionar cada semestre para gratificaciones y CTS de todo tu equipo.</p><button type="button" class="btn ghost block" data-act="prem">Ver Premium</button></section>';
  }
  return h;
}
function guideView() {
  const rows = [['Remuneración Mínima Vital', 'S/ 1,230 (desde el 1 de oct. 2026)'], ['Asignación familiar (10% RMV)', 'S/ ' + ASIG.toFixed(2)], ['UIT 2026', fmt(UIT)],
    ['Gratificaciones', 'Jul. y dic. · 1 sueldo + 9% (EsSalud) o 6.75% (EPS)'], ['CTS', 'Depósito hasta 15 may. y 15 nov. · 1/12 por mes'], ['Vacaciones', '30 días (general) · 15 días (REMYPE)'],
    ['Retención 4.ª categoría', '8% si el honorario supera S/ 3,000 al mes'], ['Pensión', 'ONP 13% · AFP ≈ 12–13% (varía)'], ['Renta 5.ª categoría', 'Se deducen 7 UIT; tramos 8%, 14%, 17%, 20%, 30%'], ['Despido arbitrario', '1.5 sueldos por año, tope 12 (general)']];
  let h = '<section class="card"><h2>Reglas que usa Liquida</h2><div class="tbl">';
  rows.forEach(function (r) { h += '<div class="tr"><span>' + r[0] + '</span><span class="num" style="text-align:right;white-space:normal;font-size:.8rem">' + r[1] + '</span></div>'; });
  h += '</div></section>';
  if (IS_OWNER && DB) {
    h += '<section class="card"><h2>Panel del creador</h2><p class="sub">Interés en Premium registrado por quienes abren esta página.</p>' +
      (STATS ? '<div class="tbl"><div class="tr"><span>Plan mensual</span><span class="num">' + STATS.mensual + '</span></div><div class="tr"><span>Plan anual</span><span class="num">' + STATS.anual + '</span></div><div class="tr tot"><span>Total interesados</span><span class="num">' + (STATS.mensual + STATS.anual) + '</span></div></div>' : '<p class="fine">Cargando…</p>') + '</section>';
  }
  h += '<section class="card"><h2>Importante</h2><div class="note">' + ICON.info + '<span>Liquida es una herramienta referencial. No sustituye la asesoría de un abogado laboralista o contador, ni constituye consejo legal o financiero. Las cifras se basan en la normativa vigente en octubre de 2026 y pueden cambiar.</span></div>' +
    '<p class="fine">Confirma montos y fechas en gob.pe/trabajo y sunat.gob.pe antes de pagar o firmar una liquidación.</p></section>';
  return h;
}
function render() {
  const t = S.tab;
  let h = '<header class="top"><div class="brand"><svg class="logo" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9"/><path d="M9 24V10M9 10h7a4 4 0 010 8H9M17 18l7 6"/></svg><div>Liquida<small>Beneficios laborales Perú</small></div></div>' +
    '<button type="button" class="pchip" data-act="prem" aria-label="Plan">' + (S.premium ? '<b>Premium</b>' : 'Plan <b>Gratis</b>') + '</button></header>' +
    '<nav class="nav" role="tablist">' + [['calc', 'Calcular'], ['team', 'Equipo'], ['guide', 'Guía']].map(function (x) {
      return '<button type="button" role="tab" data-act="tab" data-v="' + x[0] + '" aria-selected="' + (t === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</nav>';
  h += t === 'calc' ? calcView() : t === 'team' ? teamView() : guideView();
  h += '<footer class="disc"><span>Cálculos referenciales, no constituyen asesoría legal ni financiera.</span></footer>';
  app.innerHTML = h;
}

function openSheet(html) { sheet.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>'; sheet.hidden = false; }
function closeSheet() { sheet.hidden = true; sheet.innerHTML = ''; }
function openPremium() {
  openSheet('<div class="sh-top"><h2>Liquida Premium</h2><button type="button" class="ib" aria-label="Cerrar" data-act="close">' + ICON.close + '</button></div>' +
    '<ul class="list"><li>' + ICON.check + '<span>Trabajadores ilimitados (gratis: hasta 3)</span></li><li>' + ICON.check + '<span>Indemnización por despido arbitrario en la liquidación</span></li><li>' + ICON.check + '<span>Totales de planilla por semestre</span></li>' + (siteMode() ? '<li>' + ICON.check + '<span>Exportar a PDF y Excel, y planilla del mes para tu equipo</span></li>' : '') + '</ul>' +
    '<div class="plans"><button type="button" class="plan" data-act="plan" data-v="mensual" aria-pressed="' + (S.plan === 'mensual') + '"><span>Mensual</span><b>S/ 9.90</b></button><button type="button" class="plan" data-act="plan" data-v="anual" aria-pressed="' + (S.plan === 'anual') + '"><span>Anual</span><b>S/ 79</b><em>Ahorra 33%</em></button></div>' +
    (!S.premium && window.LIQUIDA_CFG ? '<div class="fld"><label for="p-mail">Tu correo (te avisamos cuando abra la suscripción)</label><input id="p-mail" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com"></div>' : '') + (S.premium ? '<button type="button" class="btn ghost block" data-act="unprem">Volver al plan gratis</button>' : '<button type="button" class="btn block" data-act="goprem">Probar Premium y reservar mi lugar</button>') +
    '<p class="fine center">Aún no hay cobro: activas Premium de prueba y registramos tu interés en el plan elegido para avisarte cuando abra la suscripción.</p>');
}
function openAdd() {
  openSheet('<div class="sh-top"><h2>Nuevo trabajador</h2><button type="button" class="ib" aria-label="Cerrar" data-act="close">' + ICON.close + '</button></div>' +
    '<div class="fld"><label for="n-name">Nombre</label><input id="n-name" type="text" maxlength="40" autocomplete="off"></div>' +
    '<div class="fld"><label for="n-sueldo">Sueldo mensual (S/)</label><input id="n-sueldo" class="num" type="number" inputmode="decimal" min="0" value="' + (Number(S.f.sueldo) || 0) + '"></div>' +
    '<label class="chk"><input type="checkbox" id="n-asig"> Recibe asignación familiar</label>' +
    '<div class="fld"><label for="n-reg">Régimen</label><select id="n-reg">' + Object.keys(REG).map(function (k) { return '<option value="' + k + '">' + REG[k].n + '</option>'; }).join('') + '</select></div>' +
    '<button type="button" class="btn block" data-act="savew">Guardar</button>');
  setTimeout(function () { const e = document.getElementById('n-name'); if (e) e.focus(); }, 30);
}
function setRes() { const r = document.getElementById('res'); if (r) r.innerHTML = resultHTML(); }

app.addEventListener('input', function (e) {
  const k = e.target.dataset.k; if (!k) return;
  const t = e.target;
  if (t.type === 'checkbox') {
    if (k === 'despido' && t.checked && !S.premium) { t.checked = false; openPremium(); return; }
    S.f[k] = t.checked;
  } else if (t.type === 'number') S.f[k] = t.value === '' ? '' : Number(t.value);
  else S.f[k] = t.value;
  if (k === 'gratiLast' && t.value === '') S.f[k] = '';
  save(); setRes();
});
app.addEventListener('change', function (e) {
  if (e.target.dataset.actChange === 'pick') {
    const w = S.workers.filter(function (x) { return x.id === e.target.value; })[0];
    if (w) { S.f.sueldo = w.sueldo; S.f.asig = w.asig; S.f.reg = w.reg; save(); render(); toast('Datos de ' + w.name + ' cargados'); }
  }
});
function onClick(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'tab') { S.tab = v; render(); }
  else if (a === 'calc') { S.calc = v; save(); render(); }
  else if (a === 'modo') { S.f.modo = v; save(); render(); }
  else if (a === 'copy') copy(S.copyText || '');
  else if (a === 'csv-res') downloadCSV('liquida-' + S.calc + '.csv', S.csvRows || []);
  else if (a === 'pdf-res') printView('print-res');
  else if (a === 'csv-plan') {
    const rows = [['Liquida - Planilla del mes'], ['Fecha', new Date().toLocaleDateString('es-PE')], ['Trabajador', 'Régimen', 'Remuneración bruta', 'Pensión', 'Retención 5.ª categoría', 'Neto mensual', 'Gratificación semestral', 'CTS semestral']];
    planRows().forEach(function (r) { rows.push([r.name, r.reg, r.bruto.toFixed(2), r.pen.toFixed(2), r.ret.toFixed(2), r.neto.toFixed(2), r.g.toFixed(2), r.c.toFixed(2)]); });
    rows.push(['Cálculo referencial, no es asesoría legal ni financiera']);
    downloadCSV('liquida-planilla.csv', rows);
  }
  else if (a === 'pdf-plan') printView('print-plan');
  else if (a === 'prem') openPremium();
  else if (a === 'plan') { S.plan = v; openPremium(); }
  else if (a === 'goprem') { const pm = document.getElementById('p-mail'); if (pm && pm.value) sendLead(pm.value.trim()); S.premium = true; recordInterest(); save(); closeSheet(); render(); toast('Premium activado (demo)'); }
  else if (a === 'unprem') { S.premium = false; S.f.despido = false; save(); closeSheet(); render(); }
  else if (a === 'close') closeSheet();
  else if (a === 'addw') { if (!S.premium && S.workers.length >= 3) openPremium(); else openAdd(); }
  else if (a === 'savew') {
    const name = document.getElementById('n-name').value.trim();
    if (!name) { toast('Escribe un nombre'); return; }
    S.workers.push({ id: 'w' + Date.now().toString(36), name: name, sueldo: Number(document.getElementById('n-sueldo').value) || 0,
      asig: document.getElementById('n-asig').checked, reg: document.getElementById('n-reg').value });
    save(); closeSheet(); render();
  }
  else if (a === 'del') { S.workers = S.workers.filter(function (w) { return w.id !== b.dataset.id; }); save(); render(); }
  else if (a === 'use') {
    const w = S.workers.filter(function (x) { return x.id === b.dataset.id; })[0];
    if (w) { S.f.sueldo = w.sueldo; S.f.asig = w.asig; S.f.reg = w.reg; S.tab = 'calc'; save(); render(); window.scrollTo(0, 0); }
  }
}
app.addEventListener('click', onClick);
sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); else onClick(e); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
(function () {
  try {
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
      const p = kv.split('='), k = p[0], v = decodeURIComponent(p[1] || '');
      if (k === 'calc' && CALCS.some(function (c) { return c.id === v; })) S.calc = v;
      else if (['sueldo', 'varProm', 'meses', 'dias', 'monto'].indexOf(k) >= 0 && v !== '' && !isNaN(v)) S.f[k] = Number(v);
      else if (k === 'reg' && REG[v]) S.f.reg = v;
    });
  } catch (e) {}
})();
render();

</script>
</body></html>
